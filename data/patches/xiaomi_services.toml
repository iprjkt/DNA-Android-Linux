# Xiaomi / HyperOS Services and Telemetry Definitions
# Used by `dna patch disable-xiaomi-services` to clean telemetry and background bloat

[metadata]
name = "xiaomi-services"
description = "Xiaomi & HyperOS telemetry, daemon, ad services, and tracking packages"
version = "1.0.0"

[[packages]]
name = "MIUIAnalytics"
description = "Xiaomi user analytics, usage tracking, and data collection"
paths = [
    "product/app/MIUIAnalytics",
    "product/priv-app/MIUIAnalytics",
    "system/app/MIUIAnalytics",
    "system/priv-app/MIUIAnalytics",
    "system_ext/app/MIUIAnalytics",
    "system_ext/priv-app/MIUIAnalytics",
    "system/app/AnalyticsCore",
    "system/priv-app/AnalyticsCore",
]

[[packages]]
name = "CloudService"
description = "Xiaomi Cloud syncing and background upload services"
paths = [
    "product/app/CloudService",
    "product/priv-app/CloudService",
    "system/app/CloudService",
    "system/priv-app/CloudService",
    "system_ext/app/CloudService",
    "system_ext/priv-app/CloudService",
]

[[packages]]
name = "Joyose"
description = "Xiaomi game and performance throttling daemon with usage telemetry"
paths = [
    "product/app/Joyose",
    "product/priv-app/Joyose",
    "system/app/Joyose",
    "system/priv-app/Joyose",
    "system_ext/app/Joyose",
    "system_ext/priv-app/Joyose",
]

[[packages]]
