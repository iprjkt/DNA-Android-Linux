    "system/app/MiDaemon",
    "system/priv-app/MiDaemon",
    "system_ext/app/MiDaemon",
    "system_ext/priv-app/MiDaemon",
    "system/app/Daemon",
    "system/priv-app/Daemon",
]

[[packages]]
