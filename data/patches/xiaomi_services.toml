    "product/app/MSA-Global",
    "product/priv-app/MSA-Global",
    "product/app/MSA",
    "product/priv-app/MSA",
    "system/app/MSA-Global",
    "system/priv-app/MSA-Global",
    "system/app/MSA",
    "system/priv-app/MSA",
