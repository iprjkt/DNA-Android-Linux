[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dna-linux"
version = "0.1.0"
description = "Native Linux (x86_64) Android ROM unpack, repack, and patch toolkit"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "iprjkt", email = "muhammadaufan0101@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
dna = "dna_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["dna_core", "dna_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
